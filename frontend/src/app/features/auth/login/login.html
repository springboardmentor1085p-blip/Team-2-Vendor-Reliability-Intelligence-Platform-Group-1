<div class="login-container">

  <mat-card class="login-card">

    <h2>Vendor Reliability Platform</h2>

    <p class="subtitle">Login to continue</p>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input
        matInput
        type="email"
        [(ngModel)]="email">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Password</mat-label>

      <input
        matInput
        [type]="hide ? 'password' : 'text'"
        [(ngModel)]="password">

      <button
        mat-icon-button
        matSuffix
        type="button"
        (click)="hide=!hide">

        <mat-icon>
          {{hide ? 'visibility_off' : 'visibility'}}
        </mat-icon>

      </button>

    </mat-form-field>

    <div class="error" *ngIf="error">
      {{error}}
    </div>

    <button
      mat-raised-button
      color="primary"
      class="full-width"
      (click)="login()"
      [disabled]="loading">

      {{loading ? 'Signing In...' : 'Login'}}

    </button>

  </mat-card>

</div>
