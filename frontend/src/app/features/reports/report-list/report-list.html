<div class="container">

    <div class="toolbar">

        <h2>Generated Reports</h2>

        <input
            type="text"
            placeholder="Search Report..."
            [(ngModel)]="searchText">

    </div>

    <table>

        <thead>

            <tr>

                <th>Report Name</th>
                <th>Category</th>
                <th>Generated By</th>
                <th>Date</th>
                <th>Status</th>
                <th>Actions</th>

            </tr>

        </thead>

        <tbody>

            <tr *ngFor="let report of reports">

                <td>{{report.name}}</td>

                <td>{{report.type}}</td>

                <td>{{report.generatedBy}}</td>

                <td>{{report.date}}</td>

                <td>

                    <span
                        [ngClass]="{

                        'completed':report.status==='Completed',

                        'pending':report.status==='Pending'

                    }">

                        {{report.status}}

                    </span>

                </td>

                <td>

                    <button
                        class="download-btn"
                        (click)="downloadReport(report)">

                        Download

                    </button>

                    <button
                        class="delete-btn"
                        (click)="deleteReport(report.id)">

                        Delete

                    </button>

                </td>

            </tr>

        </tbody>

    </table>

</div>
