<div class="page">

    <div class="header">

        <div>

            <h1>Create Report</h1>

            <p>Generate business reports</p>

        </div>

    </div>

    <div class="card">

        <div class="grid">

            <div class="field">

                <label>Report Name</label>

                <input
                    type="text"
                    [(ngModel)]="report.report_name"
                    name="report_name">

            </div>

            <div class="field">

                <label>Report Type</label>

                <input
                    type="text"
                    [(ngModel)]="report.report_type"
                    name="report_type">

            </div>

            <div class="field">

                <label>Generated By</label>

                <input
                    type="text"
                    [(ngModel)]="report.generated_by"
                    name="generated_by">

            </div>

            <div class="field">

                <label>File Format</label>

                <select
                    [(ngModel)]="report.file_format"
                    name="file_format">

                    <option value="">Select</option>
                    <option>PDF</option>
                    <option>Excel</option>
                    <option>CSV</option>

                </select>

            </div>

            <div class="field">

                <label>Status</label>

                <select
                    [(ngModel)]="report.status"
                    name="status">

                    <option>Generated</option>
                    <option>Pending</option>
                    <option>Completed</option>

                </select>

            </div>

        </div>

        <div class="buttons">

            <button
                class="cancel"
                routerLink="/reports/list">

                Cancel

            </button>

            <button
                class="save"
                (click)="saveReport()"
                [disabled]="isSaving">

                {{isSaving ? 'Saving...' : 'Save Report'}}

            </button>

        </div>

    </div>

</div>
