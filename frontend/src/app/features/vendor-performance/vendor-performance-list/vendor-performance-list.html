<mat-toolbar color="primary">
  <span>Vendor Performance</span>

  <span class="spacer"></span>

  <button mat-raised-button color="accent" (click)="addPerformance()">
    <mat-icon>add</mat-icon>
    Add Performance
  </button>
</mat-toolbar>

<div class="page">

  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search</mat-label>

    <input
      matInput
      placeholder="Search vendor performance..."
      (keyup)="applyFilter($event)"
    />

    <mat-icon matSuffix>search</mat-icon>

  </mat-form-field>

  <table
    mat-table
    [dataSource]="dataSource"
    matSort
    class="mat-elevation-z8 full-width">

    <!-- ID -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let item">
        {{ item.id }}
      </td>
    </ng-container>

    <!-- Vendor -->
    <ng-container matColumnDef="vendor">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Vendor</th>
      <td mat-cell *matCellDef="let item">
        {{ item.vendor_id }}
      </td>
    </ng-container>

    <!-- Score -->
    <ng-container matColumnDef="score">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Score</th>
      <td mat-cell *matCellDef="let item">
        {{ item.performance_score }}
      </td>
    </ng-container>

    <!-- Quality -->
    <ng-container matColumnDef="quality">
      <th mat-header-cell *matHeaderCellDef>Quality</th>
      <td mat-cell *matCellDef="let item">
        {{ item.quality_rating }}
      </td>
    </ng-container>

    <!-- Response -->
    <ng-container matColumnDef="response">
      <th mat-header-cell *matHeaderCellDef>Response</th>
      <td mat-cell *matCellDef="let item">
        {{ item.response_time }}
      </td>
    </ng-container>

    <!-- Service -->
    <ng-container matColumnDef="service">
      <th mat-header-cell *matHeaderCellDef>Service</th>
      <td mat-cell *matCellDef="let item">
        {{ item.service_rating }}
      </td>
    </ng-container>

    <!-- Status -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let item">

        <mat-chip>
          {{ getStatus(item.performance_score) }}
        </mat-chip>

      </td>
    </ng-container>

    <!-- Actions -->
    <ng-container matColumnDef="actions">

      <th mat-header-cell *matHeaderCellDef>
        Actions
      </th>

      <td mat-cell *matCellDef="let item">

        <button
          mat-icon-button
          color="primary"
          (click)="editPerformance(item.id!)">

          <mat-icon>edit</mat-icon>

        </button>

        <button
          mat-icon-button
          color="warn"
          (click)="deletePerformance(item.id!)">

          <mat-icon>delete</mat-icon>

        </button>

      </td>

    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

  <mat-paginator
    [pageSize]="5"
    [pageSizeOptions]="[5,10,20]"
    showFirstLastButtons>
  </mat-paginator>

</div>
