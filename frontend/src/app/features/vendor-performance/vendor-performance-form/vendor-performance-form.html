<div class="container">

    <h2>

        {{ isEdit ? 'Edit Vendor Performance' : 'Add Vendor Performance' }}

    </h2>

    <div class="form">

        <label>Vendor ID</label>

        <input
            type="number"
            [(ngModel)]="performance.vendor_id">

        <label>On Time Deliveries</label>

        <input
            type="number"
            [(ngModel)]="performance.on_time_deliveries">

        <label>Delayed Deliveries</label>

        <input
            type="number"
            [(ngModel)]="performance.delayed_deliveries">

        <label>Quality Rating</label>

        <input
            type="number"
            step="0.1"
            [(ngModel)]="performance.quality_rating">

        <label>Response Time</label>

        <input
            type="number"
            step="0.1"
            [(ngModel)]="performance.response_time">

        <label>Issue Resolution Time</label>

        <input
            type="number"
            step="0.1"
            [(ngModel)]="performance.issue_resolution_time">

        <label>Order Completion Rate</label>

        <input
            type="number"
            step="0.1"
            [(ngModel)]="performance.order_completion_rate">

        <label>Service Rating</label>

        <input
            type="number"
            step="0.1"
            [(ngModel)]="performance.service_rating">

        <label>Performance Score</label>

        <input
            type="number"
            step="0.1"
            [(ngModel)]="performance.performance_score">

        <br><br>

        <button
            (click)="savePerformance()"
            [disabled]="loading">

            {{ loading ? 'Saving...' :
               (isEdit ? 'Update Performance' : 'Save Performance') }}

        </button>

        <button
            type="button"
            (click)="resetForm()">

            Reset

        </button>

    </div>

</div>
