<h1>Vendor Reliability Dashboard</h1>

<div class="cards">

    <div class="card">
        <h3>Total Vendors</h3>
        <h1>{{totalVendors}}</h1>
    </div>

    <div class="card">
        <h3>Active Vendors</h3>
        <h1>{{activeVendors}}</h1>
    </div>

    <div class="card">
        <h3>Pending Vendors</h3>
        <h1>{{pendingVendors}}</h1>
    </div>

    <div class="card">
        <h3>Reliability Score</h3>
        <h1>{{reliabilityScore}}%</h1>
    </div>

</div>
