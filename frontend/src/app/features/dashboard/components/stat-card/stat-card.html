<div class="card" [style.border-top-color]="color">

    <div class="top">

        <div class="icon" [style.background]="color">

            <mat-icon>{{icon}}</mat-icon>

        </div>

        <div>

            <h4>{{title}}</h4>

            <h1>{{value}}</h1>

        </div>

    </div>

    <div class="bottom">

        <span class="growth">
            ↑ 12%
        </span>

        <span>
            Compared to last month
        </span>

    </div>

</div>
