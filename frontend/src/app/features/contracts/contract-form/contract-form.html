<div class="form-page-container">

  <div class="form-header">

    <a
      routerLink="/contracts"
      class="back-link"
    >
      &larr; Back to Contracts
    </a>

    <h1 class="page-title">
      {{ isEditMode ? 'Edit Contract' : 'Add Contract' }}
    </h1>

    <p class="page-subtitle">
      Configure agreement terms and vendor assignment.
    </p>

  </div>

  <div
    *ngIf="errorMessage"
    class="alert-banner"
  >
    {{ errorMessage }}
  </div>

  <div class="form-card">

    <form
      [formGroup]="contractForm"
      (ngSubmit)="onSubmit()"
    >

      <div class="form-grid">

        <div class="form-group">
          <label for="contract_number">
            Contract Number *
          </label>

          <input
            id="contract_number"
            type="text"
            formControlName="contract_number"
            placeholder="e.g. CNT-2026-001"
          />
        </div>

        <div class="form-group">
          <label for="vendor_id">
            Vendor *
          </label>

          <select
            id="vendor_id"
            formControlName="vendor_id"
          >
            <option
              [ngValue]="null"
              disabled
            >
              Select Vendor
            </option>

            <option
              *ngFor="let vendor of vendors"
              [value]="vendor.id"
            >
              {{ vendor.company_name }}
            </option>
          </select>
        </div>

        <div class="form-group full-width">
          <label for="contract_title">
            Contract Title *
          </label>

          <input
            id="contract_title"
            type="text"
            formControlName="contract_title"
            placeholder="e.g. Annual Maintenance Contract"
          />
        </div>

        <div class="form-group">
          <label for="contract_value">
            Contract Value ($) *
          </label>

          <input
            id="contract_value"
            type="number"
            step="0.01"
            formControlName="contract_value"
            placeholder="0.00"
          />
        </div>

        <div class="form-group">
          <label for="status">
            Status *
          </label>

          <select
            id="status"
            formControlName="status"
          >
            <option value="draft">
              Draft
            </option>

            <option value="active">
              Active
            </option>

            <option value="under_review">
              Under Review
            </option>

            <option value="expired">
              Expired
            </option>

            <option value="terminated">
              Terminated
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="start_date">
            Start Date *
          </label>

          <input
            id="start_date"
            type="date"
            formControlName="start_date"
          />
        </div>

        <div class="form-group">
          <label for="end_date">
            End Date *
          </label>

          <input
            id="end_date"
            type="date"
            formControlName="end_date"
          />
        </div>

        <div class="form-group full-width">
          <label for="terms_conditions">
            Terms and Conditions
          </label>

          <textarea
            id="terms_conditions"
            rows="5"
            formControlName="terms_conditions"
            placeholder="Enter contract terms, milestones or notes..."
          ></textarea>
        </div>

      </div>

      <div class="form-footer">

        <button
          type="button"
          class="btn btn-outline"
          routerLink="/contracts"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="submitting"
        >
          {{
            submitting
              ? 'Saving...'
              : (isEditMode
                  ? 'Save Changes'
                  : 'Create Contract')
          }}
        </button>

      </div>

    </form>

  </div>

</div>
