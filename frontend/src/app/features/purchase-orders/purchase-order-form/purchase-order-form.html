<div class="form-page">

  <a routerLink="/purchase-orders" class="back-link">
    ← Back to Purchase Orders
  </a>

  <h1>
    {{ isEditMode ? 'Edit Purchase Order' : 'Create Purchase Order' }}
  </h1>

  <p>
    Configure order requirements, assign supplier and specify fulfillment timelines.
  </p>

  <div *ngIf="errorMessage" class="alert">
    {{ errorMessage }}
  </div>

  <div class="form-card">
    <form
      [formGroup]="poForm"
      (ngSubmit)="onSubmit()">

      <div class="grid">

        <label>
          PO Number *
          <input
            type="text"
            formControlName="po_number"
            placeholder="PO-2026-0891" />
        </label>

        <label>
          Assigned Vendor *
          <select formControlName="vendor_id">
            <option [ngValue]="null">
              Select Vendor
            </option>

            <option
              *ngFor="let vendor of vendors"
              [value]="vendor.id">
              {{ vendor.company_name }}
            </option>
          </select>
        </label>

        <label>
          Total Amount *
          <input
            type="number"
            step="0.01"
            formControlName="amount"
            placeholder="0.00" />
        </label>

        <label>
          Order Date *
          <input
            type="date"
            formControlName="order_date" />
        </label>

        <label>
          Expected Delivery
          <input
            type="date"
            formControlName="expected_delivery_date" />
        </label>

        <label>
          Fulfillment Status
          <select formControlName="status">
            <option value="draft">Draft</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="shipped">Shipped</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </label>

        <label>
          Payment Status
          <select formControlName="payment_status">
            <option value="pending">Pending</option>
            <option value="partial">Partial</option>
            <option value="paid">Paid</option>
            <option value="overdue">Overdue</option>
            <option value="refunded">Refunded</option>
          </select>
        </label>

        <label class="full">
          Internal Procurement Notes
          <textarea
            rows="5"
            formControlName="notes"
            placeholder="Procurement notes..."></textarea>
        </label>

      </div>

      <div class="footer">
        <button
          type="button"
          class="outline"
          routerLink="/purchase-orders">
          Cancel
        </button>

        <button
          type="submit"
          class="primary"
          [disabled]="submitting || loadingData">
          {{
            submitting
              ? 'Processing...'
              : isEditMode
                ? 'Save Changes'
                : 'Create Purchase Order'
          }}
        </button>
      </div>

    </form>
  </div>
</div>
