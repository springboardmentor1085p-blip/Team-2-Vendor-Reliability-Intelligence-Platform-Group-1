<div class="po-container">

  <div class="header">
    <h1>Purchase Order</h1>
    <p>Create and manage purchase orders</p>
  </div>

  <div class="form-card">

    <h2>Create Purchase Order</h2>

    <p
      *ngIf="message"
      class="message">
      {{ message }}
    </p>

    <div class="form-grid">

      <div class="form-group">
        <label>PO Number</label>

        <input
          type="text"
          placeholder="Enter PO Number"
          [(ngModel)]="purchaseOrder.poNumber">
      </div>

      <div class="form-group">
        <label>Vendor</label>

        <select [(ngModel)]="purchaseOrder.vendor">

          <option value="">
            Select Vendor
          </option>

          <option
            *ngFor="let vendor of vendors"
            [value]="vendor">

            {{ vendor }}

          </option>

        </select>
      </div>

      <div class="form-group">
        <label>Item Name</label>

        <input
          type="text"
          placeholder="Enter Item Name"
          [(ngModel)]="purchaseOrder.itemName">
      </div>

      <div class="form-group">
        <label>Quantity</label>

        <input
          type="number"
          min="1"
          placeholder="Enter Quantity"
          [(ngModel)]="purchaseOrder.quantity">
      </div>

      <div class="form-group">
        <label>Order Date</label>

        <input
          type="date"
          [(ngModel)]="purchaseOrder.orderDate">
      </div>

      <div class="form-group">
        <label>Expected Delivery</label>

        <input
          type="date"
          [(ngModel)]="purchaseOrder.expectedDelivery">
      </div>

      <div class="form-group">
        <label>Status</label>

        <select [(ngModel)]="purchaseOrder.status">

          <option value="Pending">
            Pending
          </option>

          <option value="Approved">
            Approved
          </option>

          <option value="Ordered">
            Ordered
          </option>

        </select>
      </div>

    </div>

    <div class="button-group">

      <button
        class="create-btn"
        (click)="createPurchaseOrder()">

        Create Purchase Order

      </button>

      <button
        class="reset-btn"
        (click)="resetForm()">

        Reset

      </button>

    </div>

  </div>

</div>
