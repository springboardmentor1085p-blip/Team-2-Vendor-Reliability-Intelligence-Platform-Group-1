<div class="container mt-4">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">

    <h2 class="mb-0">📋 {{ title }}</h2>

    <a routerLink="/analytics" class="btn btn-outline-primary">
      ← Back to Analytics
    </a>

  </div>

  <!-- Count -->
  <div class="alert alert-info mb-3">
    Orders Count: <b>{{ orders.length }}</b>
  </div>

  <!-- Empty State -->
  <div *ngIf="orders.length === 0"
       class="text-center p-5 border rounded-4 bg-light">

    <div style="font-size:48px">📭</div>

    <h4 class="mt-3">No Orders Found</h4>

    <p class="text-muted mb-0">
      There are currently no matching purchase orders.
    </p>

  </div>

  <!-- Table -->
  <div *ngIf="orders.length > 0"
       class="card shadow border-0 rounded-4">

    <div class="card-body table-responsive">

      <table class="table table-hover align-middle mb-0">

        <thead class="table-light">
          <tr>
            <th>PO ID</th>
            <th>Vendor</th>
            <th>Status</th>
            <th>Target Date</th>
            <th>Change Status</th>
          </tr>
        </thead>

        <tbody>

          <tr *ngFor="let po of orders">

            <!-- PO ID clickable -->
            <td>
              <a [routerLink]="['/purchase-order', po.id]"
                 class="text-decoration-none fw-semibold">
                #{{ po.id }}
              </a>
            </td>

            <td>{{ po.vendor_name }}</td>

            <!-- Status Badge -->
            <td>

              <span class="badge"
                    [ngClass]="
                      po.status === 'Delivered' ? 'bg-success' :
                      po.status === 'In Progress' ? 'bg-warning text-dark' :
                      po.status === 'Pending Review' ? 'bg-info text-dark' :
                      po.status === 'Pending' ? 'bg-warning text-dark' :
                      po.status === 'Approved' ? 'bg-primary' :
                      po.status === 'Completed' ? 'bg-dark' :
                      po.status === 'Cancelled' ? 'bg-secondary' :
                      po.status === 'Rejected' ? 'bg-danger' :
                      po.status === 'Draft' ? 'bg-light text-dark border' :
                      po.status === 'On Hold' ? 'bg-secondary' :
                      po.status === 'Delayed' ? 'bg-danger' :
                      po.status === 'Active' ? 'bg-success' :
                      'bg-secondary'
                    ">

                {{ po.status }}

              </span>

            </td>

            <td>{{ po.target_date }}</td>

            <!-- Dropdown restored -->
            <td>

              <select
                class="form-select form-select-sm"
                [value]="po.status"
                (change)="changeStatus(po, $any($event.target).value)">

                <option value="Draft">Draft</option>
                <option value="Pending">Pending</option>
                <option value="Pending Review">Pending Review</option>
                <option value="Approved">Approved</option>
                <option value="In Progress">In Progress</option>
                <option value="Delivered">Delivered</option>
                <option value="Completed">Completed</option>
                <option value="Cancelled">Cancelled</option>
                <option value="Rejected">Rejected</option>
                <option value="On Hold">On Hold</option>
                <option value="Delayed">Delayed</option>
                <option value="Active">Active</option>

              </select>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
