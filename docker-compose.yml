version: "3.9"

services:

  # ─────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: vrip_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vendor_reliability_db
      POSTGRES_USER: ${POSTGRES_USER:-vrip_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vrip_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # 5433 on host to avoid conflict with local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vrip_user} -d vendor_reliability_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vrip_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROJECT_NAME: "Vendor Reliability Intelligence Platform"
      PROJECT_VERSION: "1.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-vrip_user}:${POSTGRES_PASSWORD:-vrip_secure_password_2026}@db:5432/vendor_reliability_db
      SECRET_KEY: ${SECRET_KEY:-vendor_reliability_super_secret_key_2026}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────
  # Angular Frontend
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vrip_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
    name: vrip_postgres_data
